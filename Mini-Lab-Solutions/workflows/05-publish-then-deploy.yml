name: Publish then deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build_image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy_staging:
    needs: build_image
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy staging
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: ./scripts/deploy-staging.sh "$IMAGE"
