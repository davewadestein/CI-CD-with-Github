name: Advanced checks

on:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advanced-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Run placeholder scan
        run: |
          mkdir -p reports
          echo "Placeholder scan completed" > reports/scan-summary.txt

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ github.run_number }}
          path: reports/scan-summary.txt
          retention-days: 5
