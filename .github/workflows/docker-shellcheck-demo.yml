name: Docker ShellCheck Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-shell:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck Docker action
        uses: ./.github/actions/shellcheck
        with:
          target: scripts/*.sh
